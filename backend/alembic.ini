[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Set the database URL. Examples:
#   SQLite (dev):  sqlite:///./clakettes.db
#   MariaDB (prod): mariadb+pymysql://user:password@localhost:3306/clakettes_db
# Can also be overridden via the DATABASE_URL environment variable in env.py.
sqlalchemy.url = sqlite:///./clakettes.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
