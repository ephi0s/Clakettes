[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clakettes-backend"
version = "0.3.0"
description = "Clakettes film festival management platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "pymysql==1.2.4",
    "python-multipart==0.0.33",
    "PyJWT==2.10.1",
    "cryptography==50.0.1",
    "bcrypt>=4.3.0",
    "alembic==1.20.1",
    "reportlab==5.1.0",
    "Pillow==13.0.0",
    "mutagen==1.48.1",
    "pypdf==6.21.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["interop: interoperability tests that drive the real caldav client against a live server"]
