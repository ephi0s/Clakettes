[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clakettes-backend"
version = "0.3.0"
description = "Clakettes film festival management platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "email-validator==2.4.0",
    "pymysql==1.2.4",
    "python-multipart==0.0.34",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "bcrypt==5.0.0",
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
    "pyasn1>=0.6.5",
    "alembic==1.20.1",
    "reportlab==5.1.0",
    "Pillow==13.0.0",
    "mutagen==1.48.1",
    "pypdf==7.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["interop: interoperability tests that drive the real caldav client against a live server"]
