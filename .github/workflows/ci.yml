name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  FLUTTER_VERSION: "3.47.3"

jobs:
  # ─── LINT ─────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ruff
        run: pip install "ruff==0.15.22"
      - name: Run ruff check
        run: ruff check .
      - name: Check ruff format
        run: ruff format --check .

  frontend-lint:
    name: Frontend Lint (flutter analyze)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run flutter analyze
        run: flutter analyze

  # ─── TEST ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest, SQLite)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          TESTING: "true"
          SECRET_KEY: "test-secret-key-for-ci-only"
        run: pytest tests/ -m "not interop" -x -q --tb=short

  backend-migration:
    name: Backend Migrations (MariaDB)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: clakettes_test
          MARIADB_USER: clakettes_user
          MARIADB_PASSWORD: clakettes_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -u root -prootpassword"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 15); do
            mariadb-admin ping -h 127.0.0.1 -u root -prootpassword --silent && break
            sleep 1
          done
          mariadb-admin ping -h 127.0.0.1 -u root -prootpassword
      - name: Run migrations
        env:
          DATABASE_URL: mariadb+pymysql://clakettes_user:clakettes_password@127.0.0.1:3306/clakettes_test
        run: alembic upgrade head

  frontend-test:
    name: Frontend Tests (flutter test)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        run: flutter test

  # ─── BUILD (Docker) ───────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-26.04
    needs: [backend-lint, frontend-lint, backend-test, backend-migration, frontend-test]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend (dev)
        run: docker compose build backend
      - name: Build frontend (dev)
        run: docker compose build frontend
      - name: Build backend (prod)
        run: docker compose -f docker-compose.yml build backend-prod
      - name: Build frontend (prod)
        run: docker compose -f docker-compose.yml build frontend-prod

  # ─── DEPLOY (optional, manual trigger) ────────────────────────────
  # deploy:
  #   name: Deploy to Production
  #   runs-on: ubuntu-26.04
