name: clakettes
description: Plataforma multiplataforma para la gestión de festivales de cine y cortos express
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^7.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.4
  file_picker: ^13.1.0
  geolocator: ^11.0.0
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.3
  web_socket_channel: ^2.4.0
  url_launcher: ^6.2.1
  pointycastle: ^3.7.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  path_provider: ^2.1.6
  web: ^1.1.1
  table_calendar: ^3.2.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/l10n/

